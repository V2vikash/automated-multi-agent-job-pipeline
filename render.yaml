services:
  - type: web
    name: automated-multi-agent-job-pipeline-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://automated-multi-agent-job-pipeline.onrender.com
